name: Meta Ads Playwright Scraper

on:
  schedule:
    # 毎時0分（1時間ごと）に自動実行
    - cron: '1 * * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install playwright pandas gspread google-auth; fi
        playwright install chromium --with-deps

    - name: Run Playwright script
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: python scrape_ads.py

    - name: Commit and Push retrieved CSV
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update: Scraped Meta ads data [skip ci]"
          git push
        else
          echo "No changes to commit."
        fi
